<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفعيل حساب صاحب الدعوة</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f4eadd url('ivory-frame.png') center/cover fixed;font:16px Tahoma,Arial;color:#64492f;display:grid;place-items:center}.panel{width:min(92vw,490px);padding:28px;border:1px solid #cbb18a;background:#fffaf2e8;backdrop-filter:blur(8px);border-radius:18px;box-shadow:0 12px 40px #5b422622}h1{font-size:24px}input,button{display:block;width:100%;padding:12px;margin:10px 0;border:1px solid #c9af89;border-radius:10px;font:inherit}button{background:#a58252;color:white;cursor:pointer}button.secondary{background:white;color:#775936}p{line-height:1.8}small{color:#836d54}#setPassword{display:none}a{color:#74512c}</style></head><body><main class="panel"><h1>تفعيل لوحة صاحب الدعوة</h1><p>Invitation by Ghada</p><p>أدخلي بريدك الإلكتروني، ثم افتحي رسالة التحقق لتعيين كلمة المرور. الوصول إلى بيانات الدعوة لا يُمنح إلا للحساب الذي صرّحت له المصممة.</p><form id="request"><input id="email" type="email" autocomplete="email" placeholder="البريد الإلكتروني" required><button type="submit">إرسال رابط التفعيل / تعيين كلمة المرور</button></form><form id="setPassword"><h2>تعيين كلمة المرور</h2><input id="pass" type="password" minlength="10" autocomplete="new-password" placeholder="كلمة مرور جديدة (10 أحرف على الأقل)" required><input id="pass2" type="password" minlength="10" autocomplete="new-password" placeholder="تأكيد كلمة المرور" required><button type="submit">حفظ كلمة المرور والدخول</button></form><p id="status" role="status"></p><p><a id="back" href="owner.html">العودة إلى تسجيل الدخول</a></p><small>لا تشاركي كلمة المرور أو رابط التحقق مع أحد.</small></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/+esm';
const sb=createClient('https://jzswtwicvgppisasrkqe.supabase.co','sb_publishable_qJGOZoWBOrZ952qJnYTqNg_oaMSIStu',{auth:{detectSessionInUrl:true}});
const slug=new URLSearchParams(location.search).get('invitation')||'mohammad-atheer';const ownerUrl=new URL('owner.html',location.href);ownerUrl.searchParams.set('invitation',slug);const redirectUrl=new URL('activate.html',location.href);redirectUrl.searchParams.set('invitation',slug);document.getElementById('back').href=ownerUrl.href;
const status=document.getElementById('status');const req=document.getElementById('request'),set=document.getElementById('setPassword');
async function showPassword(){const {data:{session}}=await sb.auth.getSession();if(session){req.style.display='none';set.style.display='block';status.textContent='تم التحقق من البريد. اختاري كلمة مرور جديدة.'}}
sb.auth.onAuthStateChange((event,session)=>{if(session&&(event==='PASSWORD_RECOVERY'||event==='SIGNED_IN'))showPassword()});showPassword();
req.onsubmit=async e=>{e.preventDefault();status.textContent='جارٍ إرسال الرابط...';const email=document.getElementById('email').value.trim();const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirectUrl.href});status.textContent=error?'تعذر إرسال الرابط. تحققي من الإعدادات وحاولي لاحقًا.':'إذا كان البريد مسجلًا، ستصلك رسالة لتعيين كلمة المرور. إذا لم يكن مسجلًا، تواصلي مع المصممة لتفعيل الحساب.'};
set.onsubmit=async e=>{e.preventDefault();const p=document.getElementById('pass').value;if(p!==document.getElementById('pass2').value){status.textContent='كلمتا المرور غير متطابقتين';return}status.textContent='جارٍ الحفظ...';const {error}=await sb.auth.updateUser({password:p});if(error){status.textContent='تعذر حفظ كلمة المرور. افتحي رابط التحقق مرة أخرى.';return}location.assign(ownerUrl.href)};
</script></body></html>
